; output_buffering: igual que XAMPP. Evita el error "headers already sent"
output_buffering = 4096

; Los errores NO se muestran en la pagina (asi no se ven datos internos),
; se guardan en el registro: docker compose logs web
display_errors = Off
log_errors = On
error_reporting = E_ALL

; Cookie de sesion: el JavaScript no puede leerla, no se manda desde otras webs
; y PHP no acepta ids de sesion inventados por un atacante
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1

; No mostrar la version de PHP en las cabeceras
expose_php = Off

; Codigo que se ejecuta antes de cada pagina (cookie de sesion segura con HTTPS)
auto_prepend_file = /var/www/html/seguridad_inicio.php
