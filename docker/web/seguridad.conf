# Ficheros que Apache NUNCA debe servir por la web (aunque alguien escriba la direccion)
<FilesMatch "^\.env|^\.git|\.(sql|yml|json)$|^Dockerfile$">
    Require all denied
</FilesMatch>

# Carpetas internas del proyecto
<DirectoryMatch "^/var/www/html/(db|docker)(/|$)">
    Require all denied
</DirectoryMatch>

# La libreria de correo solo la usa PHP por dentro: nadie debe poder abrir sus ficheros por la web
<DirectoryMatch "/PHPMailer-master">
    Require all denied
</DirectoryMatch>

# En las carpetas donde se suben imagenes NUNCA se ejecuta PHP (aunque alguien consiguiera subir uno)
<DirectoryMatch "^/var/www/html/imagenes(_productos)?(/|$)">
    <FilesMatch "\.(php|phtml|phar|php[0-9])$">
        Require all denied
    </FilesMatch>
</DirectoryMatch>

# Sin listado de carpetas
<Directory /var/www/html>
    Options -Indexes
</Directory>

# No decir que version de Apache se usa
ServerTokens Prod
ServerSignature Off

# Cabeceras de seguridad
<IfModule mod_headers.c>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
</IfModule>
